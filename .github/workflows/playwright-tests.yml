name: Playwright Visual Tests
on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Test Suite Name'
        required: false
        default: 'Visual Audit'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium
      - name: Run Viewport Captures
        shell: bash
        run: |
          mkdir -p screenshots
          node - << 'EOF'
          const { chromium, devices } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage({ viewport: { width: 1920, height: 1080 } });
            await page.goto(`file://${process.cwd()}/index.html`, { waitUntil: 'load' });
            await page.screenshot({ path: 'screenshots/desktop-1080p.png', fullPage: true });
            const mob = await browser.newPage({ ...devices['Pixel 7'] });
            await mob.goto(`file://${process.cwd()}/index.html`, { waitUntil: 'load' });
            await mob.screenshot({ path: 'screenshots/mobile-pixel7.png', fullPage: true });
            await browser.close();
          })();
          EOF
      - name: Upload Screenshots
        uses: actions/upload-artifact@v4
        with:
          name: Visual-Screenshots
          path: screenshots/
          if-no-files-found: error