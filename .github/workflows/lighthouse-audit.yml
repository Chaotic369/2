name: Lighthouse CI Web Audit
on:
  workflow_dispatch:
    inputs:
      audit_url:
        description: 'Target URL (blank for GitHub Pages)'
        required: false
        default: ''
jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Lighthouse
        run: npm install -g @lhci/cli chrome-launcher
      - name: Run Lighthouse Audit
        shell: bash
        run: |
          TARGET="${{ github.event.inputs.audit_url }}"
          if [ -z "$TARGET" ]; then
            REPO_NAME="${GITHUB_REPOSITORY#*/}"
            TARGET="https://${GITHUB_REPOSITORY_OWNER}.github.io/${REPO_NAME}/"
          fi
          echo "Auditing URL: $TARGET"
          lhci collect --url="$TARGET" --settings.chromeFlags="--no-sandbox --headless"
          lhci upload --target=filesystem --outputDir=./lighthouse-report || true
      - name: Upload Audit HTML Report
        uses: actions/upload-artifact@v4
        with:
          name: Lighthouse-Report
          path: ./lighthouse-report/
          if-no-files-found: warn